<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
   <style>
     html, body { height: 100%; margin: 0; padding: 0; }
     #map { height: 100%; width: 100%; }
   </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   <script>
     const map = L.map('map').setView([0, 0], 1); // Centered on world, zoom level 1
     L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
       attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
     }).addTo(map);

     Promise.all([
       fetch('airports.json').then(response => response.json()),
       fetch('epstein_flights.json').then(response => response.json())
     ]).then(([airports, flights]) => {
       const airportCoords = {};
       for (const code in airports) {
         const airport = airports[code];
         airportCoords[code] = { lat: airport.lat, lon: airport.lon, name: airport.name };  // ICAO code
         if (airport.iata) {
           airportCoords[airport.iata] = { lat: airport.lat, lon: airport.lon, name: airport.name };
         }
       }

       const locations = new Set();
       flights.forEach(flight => {
         if (flight['DEP: Code']) locations.add(flight['DEP: Code']);
         if (flight['ARR: Code']) locations.add(flight['ARR: Code']);
       });

       const bounds = L.latLngBounds();
       locations.forEach(code => {
         if (airportCoords[code]) {
           const coords = airportCoords[code];
           const marker = L.marker([coords.lat, coords.lon]).addTo(map).bindPopup(coords.name);
           bounds.extend([coords.lat, coords.lon]);
         }
       });
       if (bounds.isValid()) {
         map.fitBounds(bounds, { padding: [20, 20] });
       }
     });
   </script>
</body>
</html>
