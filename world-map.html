<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Map</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
html, body { height: 100%; margin: 0; }
#map { height: 100%; width: 100%; }
#controls {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1000;
  width: 320px;
}
.red-marker { filter: hue-rotate(180deg) saturate(2); }
.form-label { margin-bottom: 0.125rem; }
</style>
</head>
<body>

<div id="controls" class="card shadow-sm">
  <div class="card-body">
    <h6 class="card-title mb-3">Filter Flights</h6>
    <form id="filterForm">
      <div class="mb-2">
        <label for="startDate" class="form-label">Start date</label>
        <input type="date" id="startDate" class="form-control">
      </div>
      <div class="mb-2">
        <label for="endDate" class="form-label">End date</label>
        <input type="date" id="endDate" class="form-control">
      </div>
      <div class="mb-2">
        <label for="airportSelect" class="form-label">Airport</label>
        <select id="airportSelect" class="form-select">
          <option value="">All airports</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="personSelect" class="form-label">Person</label>
        <select id="personSelect" class="form-select">
          <option value="">All people</option>
        </select>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-sm">Apply</button>
          <button type="button" id="clearBtn" class="btn btn-outline-secondary btn-sm">Clear</button>
        </div>
        <div id="resultCount" class="text-muted small"></div>
      </div>
      <div id="resultCount" class="mt-2 text-muted small"></div>
    </form>
  </div>
</div>

<div id="map"></div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="routeOffcanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Route Details</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div id="routeFilters" class="mb-2"></div>
    <ul id="routeFlights" class="list-group list-group-flush"></ul>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<script>
const map = L.map('map').setView([0,0],1);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markers = [];
let arcs = [];
let airports, uniqueFlights, minDate, maxDate, airportCoords = {};
let selectedArc = null;

Promise.all([
  // Original source: https://raw.githubusercontent.com/mwgg/Airports/master/airports.json
  fetch('airports.json').then(r=>r.text()).then(t=>JSON.parse(t.replace(/^\s*\/\/.*$/gm,''))),
  // Parsed and normalized from https://ia801606.us.archive.org/30/items/epstein-flight-logs-unredacted_202304/EPSTEIN%20FLIGHT%20LOGS%20UNREDACTED.pdf
  fetch('epstein_flights_normalized.json').then(r=>r.json())
]).then(([airportsData, flights]) => {
  airports = airportsData;

  for(const code in airports){
    const a = airports[code];
    airportCoords[code] = {lat:a.lat, lon:a.lon, name:a.name};
    if(a.iata) airportCoords[a.iata] = {lat:a.lat, lon:a.lon, name:a.name};
  }

  // Group flights
  const flightMap = {};
  flights.forEach(r=>{
    const id = [r['Date'],r['Aircraft Tail #'],r['DEP: Code'],r['ARR: Code'],r['Flight_No.']].join('|');
    if(!flightMap[id]) flightMap[id]=[];
    flightMap[id].push(r);
  });

  uniqueFlights = Object.keys(flightMap).map(id=>({
    id,
    flight: flightMap[id][0],
    passengers: flightMap[id]
  }));

  // Populate airport select
  const airportSet = new Set();
  uniqueFlights.forEach(i=>{
    const f = i.flight;
    if(f['DEP: Code']) airportSet.add(f['DEP: Code']);
    if(f['ARR: Code']) airportSet.add(f['ARR: Code']);
  });
  [...airportSet].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
    .forEach(code => {
      const opt = document.createElement('option');
      opt.value = code;
      opt.text = code + (airportCoords[code] ? ' – ' + airportCoords[code].name : '');
      airportSelect.appendChild(opt);
    });

  // Populate person select
  const people = new Set();
  uniqueFlights.forEach(i=>i.passengers.forEach(p=>{if(p['Last, First']) people.add(p['Last, First']);}));
  [...people].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
    .forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.text = name;
      personSelect.appendChild(opt);
    });

  const dates = uniqueFlights.map(i=>new Date(i.flight['Date']));
  minDate = new Date(Math.min(...dates));
  maxDate = new Date(Math.max(...dates));
  startDate.value = minDate.toISOString().split('T')[0];
  endDate.value = maxDate.toISOString().split('T')[0];

  buildMap(uniqueFlights);
  selectRouteFromHash();
});

function selectRouteFromHash(){
  const hash = window.location.hash.slice(1); // remove #
  if(!hash) return;
  const [dep, arr] = hash.split('-');
  if(!dep || !arr) return;

  // find the matching arc
  const match = arcs.find(a=>{
    const f = a.routeFlights[0];
    const d = f['DEP: Code'];
    const r = f['ARR: Code'];
    return (d===dep && r===arr) || (d===arr && r===dep);
  });

  if(match){
    match.fire('click'); // programmatically trigger click
  }
}

function buildMap(flights, selectedAirport){
  markers.forEach(m=>map.removeLayer(m));
  arcs.forEach(a=>map.removeLayer(a));
  markers = []; arcs = []; selectedArc = null;

  const routes = {}; const locations = new Set();

  flights.forEach(item=>{
    const f = item.flight;
    const dep = f['DEP: Code'], arr = f['ARR: Code'];
    if(!dep||!arr||dep===arr) return;
    locations.add(dep); locations.add(arr);
    const key = dep<arr? dep+'-'+arr : arr+'-'+dep;
    if(!routes[key]) routes[key]={dep,arr,flights:[]};
    routes[key].flights.push({
      ...f,
      passengers: item.passengers
    });
  });

  // markers
  locations.forEach(code=>{
    let c = airportCoords[code] || airportCoords['K'+code];
    if(!c) return;
    const m = L.marker([c.lat,c.lon]).addTo(map).bindPopup(`${c.name} (${code})`);
    if(code===selectedAirport) m._icon.classList.add('red-marker');
    markers.push(m);
  });

  // arcs
  Object.values(routes).forEach(route=>{
    const depCode = (route.dep || '').trim().toUpperCase();
    const arrCode = (route.arr || '').trim().toUpperCase();
    const a = airportCoords[depCode] || airportCoords['K'+depCode];
    const b = airportCoords[arrCode] || airportCoords['K'+arrCode];

    if (!a || !b) {
      console.warn('Couldn’t find airport', {
        dep: route.dep,
        arr: route.arr,
        depCoords: !!a,
        arrCoords: !!b
      });
      return;
    }

    const gc = turf.greatCircle(turf.point([a.lon,a.lat]), turf.point([b.lon,b.lat]), {npoints:100});
    const latlngs = gc.geometry.coordinates.map(c=>[c[1],c[0]]);
    const weight = Math.min(route.flights.length,15);

    const line = L.polyline(latlngs,{color:'blue',weight}).addTo(map);
    line.routeFlights = route.flights;
    line.originalWeight = weight;

    const offcanvasEl = document.getElementById('routeOffcanvas');
    const bsOffcanvas = new bootstrap.Offcanvas(offcanvasEl); // create once

    offcanvasEl.addEventListener('hidden.bs.offcanvas', () => {
      if(selectedArc){
        selectedArc.setStyle({color:'blue', weight:selectedArc.originalWeight});
        selectedArc = null;
      }
      window.location.hash = ''; // <--- clear fragment
    });

    line.on('click', function(e){
      if(e.originalEvent) e.originalEvent.stopPropagation();

      if(selectedArc===this){
        this.setStyle({color:'blue', weight:this.originalWeight});
        selectedArc = null;
        bsOffcanvas.hide();
        window.location.hash = ''; // <--- clear fragment
        return;
      }

      if(selectedArc){
        selectedArc.setStyle({color:'blue', weight:selectedArc.originalWeight});
      }

      this.setStyle({color:'red', weight: Math.max(this.originalWeight,5)});
      selectedArc = this;

      // populate offcanvas...
      const filtersText = `Filters: Airport=${airportSelect.value||'All'}, Person=${personSelect.value||'All'}`;
      document.getElementById('routeFilters').textContent = filtersText;

      const flightsList = document.getElementById('routeFlights');
      flightsList.innerHTML = '';
      this.routeFlights.forEach(f => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        const passengers = f.passengers ? f.passengers.map(p => p['First Last']).join(', ') : '';
        li.textContent = `${f['Date']} – ${f['Aircraft Tail #']} (${f['DEP: Code']} → ${f['ARR: Code']}) | Passengers: ${passengers}`;
        flightsList.appendChild(li);
      });

      bsOffcanvas.show();

      // set hash
      const dep = this.routeFlights[0]['DEP: Code'];
      const arr = this.routeFlights[0]['ARR: Code'];
      window.location.hash = `${dep}-${arr}`;
    });

    arcs.push(line);
  });

  if(markers.length){
    const bounds = L.latLngBounds(markers.map(m=>m.getLatLng()));
    map.fitBounds(bounds.pad(0.1));
  }

  document.getElementById('resultCount').textContent = flights.length+' flight'+(flights.length===1?'':'s');
}

map.on('click', function(e){
  // if click was on a marker or polyline, ignore
  if(e.originalEvent.target.closest('.leaflet-interactive')) return;

  if(selectedArc){
    selectedArc.setStyle({color:'blue', weight:selectedArc.originalWeight});
    selectedArc = null;
    const offcanvasEl = document.getElementById('routeOffcanvas');
    const bsOffcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
    if(bsOffcanvas) bsOffcanvas.hide();
  }
});

// filters
filterForm.addEventListener('submit', e=>{
  e.preventDefault();
  const start = new Date(startDate.value);
  const end = new Date(endDate.value);
  const airport = airportSelect.value;
  const person = personSelect.value;

  let filtered = uniqueFlights.filter(i=>{
    const d = new Date(i.flight['Date']);
    return d>=start && d<=end;
  });

  if(person){
    filtered = filtered.filter(i=>i.passengers.some(p=>p['Last, First']===person));
  }

  if(airport){
    filtered = filtered.filter(i=>i.flight['DEP: Code']===airport || i.flight['ARR: Code']===airport);
  }

  buildMap(filtered, airport);
});

clearBtn.addEventListener('click', ()=>{
  startDate.value=minDate.toISOString().split('T')[0];
  endDate.value=maxDate.toISOString().split('T')[0];
  airportSelect.value='';
  personSelect.value='';
  buildMap(uniqueFlights);
});
</script>

</body>
</html>
